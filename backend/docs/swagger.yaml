openapi: 3.0.0
info:
  title: Social Network API
  version: 1.0.0
  description: Auth API Documentation

servers:
  - url: http://localhost:8888/api

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string

paths:
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Success or 2FA required
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      payload:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          user:
                            $ref: "#/components/schemas/IUser"
                  - type: object
                    properties:
                      payload:
                        type: object
                        properties:
                          twoFactorCredintals:
                            type: boolean
                          userId:
                            type: string

  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      user:
                        $ref: "#/components/schemas/IUser"

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Success

  /auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: User data
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    $ref: "#/components/schemas/IUser"

  /auth/refresh-token:
    post:
      summary: Refresh token
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: New tokens

  /auth/forgot-password:
    post:
      summary: Forgot password
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        200:
          description: Boolean result

  /auth/reset-password:
    post:
      summary: Reset password
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                newPassword:
                  type: string
      responses:
        200:
          description: Boolean result

  /auth/verify-email:
    post:
      summary: Verify email
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      responses:
        200:
          description: Boolean result

  /auth/resend-verification-email:
    post:
      summary: Resend verification email
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        200:
          description: Success

  /auth/change-password:
    post:
      summary: Change password
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string

  /auth/update-profile:
    patch:
      summary: Update profile
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string

  /auth/:
    delete:
      summary: Delete user
      tags: [Auth]
      security:
        - bearerAuth: []

  /auth/2fa/setup:
    post:
      summary: Setup 2FA
      tags: [2FA]
      security:
        - bearerAuth: []
      responses:
        200:
          description: QR + secret

  /auth/2fa/verify:
    post:
      summary: Verify 2FA
      tags: [2FA]

  /auth/2fa/login:
    post:
      summary: 2FA login
      tags: [2FA]
