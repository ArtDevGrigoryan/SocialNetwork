openapi: "3.0.0"
info:
  title: "Bardiner-Social API"
  description: "API documentation for the Bardiner-Social backend application."
  version: "1.0.0"
servers:
  - url: "http://localhost:8888/api"
    description: "Local development server"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    IUser:
      type: "object"
      properties:
        _id:
          type: "string"
        username:
          type: "string"
        email:
          type: "string"
        avatar:
          type: "string"
        bio:
          type: "string"
        website:
          type: "string"
        followersCount:
          type: "integer"
        followingCount:
          type: "integer"
        status:
          type: "string"
          enum: ["ONLINE", "OFFLINE"]
        role:
          type: "string"
          enum: ["admin", "user"]
        deactived:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    AuthPayload:
      type: "object"
      properties:
        accessToken:
          type: "string"
        refreshToken:
          type: "string"
        user:
          $ref: "#/components/schemas/IUser"
    Auth2FAPayload:
      type: "object"
      properties:
        twoFactorCredintals:
          type: "boolean"
        userId:
          type: "string"
    APIResponseAuth:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          oneOf:
            - $ref: "#/components/schemas/AuthPayload"
            - $ref: "#/components/schemas/Auth2FAPayload"
    APIResponseAuthData:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/AuthPayload"
    APIResponseBoolean:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "boolean"
    APIResponseNull:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          nullable: true
          type: "string"
    APIResponseUser:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/IUser"
    APIResponseTokens:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "object"
          properties:
            accessToken:
              type: "string"
            refreshToken:
              type: "string"
    Post:
      type: "object"
      properties:
        _id:
          type: "string"
        author:
          $ref: "#/components/schemas/IUser"
        content:
          type: "string"
        images:
          type: "array"
          items:
            type: "object"
            properties:
              url:
                type: "string"
              key:
                type: "string"
              filter:
                type: "string"
        location:
          type: "string"
        mentions:
          type: "array"
          items:
            type: "string"
        music:
          type: "object"
          properties:
            url:
              type: "string"
            title:
              type: "string"
            startTime:
              type: "number"
        likes:
          type: "integer"
        comments:
          type: "integer"
        isArchived:
          type: "boolean"
        accessRepost:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    APIResponsePost:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/Post"
    APIResponsePostArray:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "array"
          items:
            $ref: "#/components/schemas/Post"
    Comment:
      type: "object"
      properties:
        _id:
          type: "string"
        post:
          type: "string"
        author:
          $ref: "#/components/schemas/IUser"
        text:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    APIResponseCommentArray:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "array"
          items:
            $ref: "#/components/schemas/Comment"
    APIResponseComment:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/Comment"
    Participant:
      type: "object"
      properties:
        _id:
          type: "string"
        chatId:
          type: "string"
        participantName:
          type: "string"
        user:
          $ref: "#/components/schemas/IUser"
        lastReadMessage:
          type: "string"
        role:
          type: "string"
          enum: ["member", "admin"]
        unreadCount:
          type: "integer"
        isMuted:
          type: "boolean"
        deletedAt:
          type: "string"
          format: "date-time"
    Chat:
      type: "object"
      properties:
        _id:
          type: "string"
        type:
          type: "string"
          enum: ["dm", "group"]
        theme:
          type: "string"
        groupName:
          type: "string"
        groupAvatar:
          type: "string"
        lastMessage:
          type: "string"
        lastActivityAt:
          type: "string"
          format: "date-time"
        chatKey:
          type: "string"
        messagePermission:
          type: "string"
        pinned:
          type: "array"
          items:
            type: "string"
        participants:
          type: "array"
          items:
            $ref: "#/components/schemas/Participant"
    APIResponseChat:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/Chat"
    APIResponseChatArray:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "object"
          properties:
            chats:
              type: "array"
              items:
                $ref: "#/components/schemas/Chat"
            nextCursor:
              type: "string"
    Message:
      type: "object"
      properties:
        _id:
          type: "string"
        chat:
          type: "string"
        sender:
          $ref: "#/components/schemas/IUser"
        type:
          type: "string"
        text:
          type: "string"
        replyTo:
          type: "string"
        voice:
          type: "object"
          properties:
            url:
              type: "string"
            key:
              type: "string"
        image:
          type: "object"
          properties:
            url:
              type: "string"
            key:
              type: "string"
        media:
          type: "array"
          items:
            type: "object"
            properties:
              url:
                type: "string"
              key:
                type: "string"
              mediaType:
                type: "string"
        sharedPost:
          type: "string"
        sharedProfile:
          type: "string"
        sharedStory:
          type: "string"
        deletedAt:
          type: "string"
          format: "date-time"
        editedAt:
          type: "string"
          format: "date-time"
        reactions:
          type: "array"
          items:
            type: "object"
            properties:
              _id:
                type: "string"
              participant:
                type: "string"
              type:
                type: "string"
    APIResponseMessage:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/Message"
    APIResponseMessageArray:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "array"
          items:
            $ref: "#/components/schemas/Message"
    Story:
      type: "object"
      properties:
        _id:
          type: "string"
        user:
          $ref: "#/components/schemas/IUser"
        media:
          type: "object"
          properties:
            url:
              type: "string"
            key:
              type: "string"
            type:
              type: "string"
            musicUrl:
              type: "string"
            musicTitle:
              type: "string"
            musicStartTime:
              type: "number"
            musicDuration:
              type: "number"
            filter:
              type: "string"
        viewsCount:
          type: "integer"
        expiresAt:
          type: "string"
          format: "date-time"
    APIResponseStoryArray:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          type: "array"
          items:
            type: "object"
            properties:
              user:
                $ref: "#/components/schemas/IUser"
              stories:
                type: "array"
                items:
                  $ref: "#/components/schemas/Story"
              hasUnseen:
                type: "boolean"
              lastStoryAt:
                type: "string"
                format: "date-time"
    APIResponseStory:
      type: "object"
      properties:
        success:
          type: "boolean"
        message:
          type: "string"
        payload:
          $ref: "#/components/schemas/Story"
    APIResponseError:
      type: "object"
      properties:
        success:
          type: "boolean"
          example: false
        message:
          type: "string"
        error:
          nullable: true
          type: "object"

security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: "User Login"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseAuth"
        500:
          description: "Error response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseError"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                password:
                  type: "string"
  /auth/register:
    post:
      summary: "User Registration"
      tags:
        - Auth
      responses:
        201:
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseAuthData"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                password:
                  type: "string"
                name:
                  type: "string"
  /auth/logout:
    post:
      summary: "User Logout"
      tags:
        - Auth
      responses:
        204:
          description: "Logged out successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
  /auth/me:
    get:
      summary: "Get Current User"
      tags:
        - Auth
      responses:
        200:
          description: "User details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseUser"
  /auth/refresh-token:
    post:
      summary: "Refresh Access Token"
      tags:
        - Auth
      responses:
        200:
          description: "Tokens refreshed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseTokens"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                refreshToken:
                  type: "string"
  /auth/forgot-password:
    post:
      summary: "Forgot Password"
      tags:
        - Auth
      responses:
        200:
          description: "Password reset email sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
  /auth/reset-password:
    post:
      summary: "Reset Password"
      tags:
        - Auth
      responses:
        200:
          description: "Password reset successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseAuthData"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                newPassword:
                  type: "string"
                code:
                  type: "string"
  /auth/verify-email:
    post:
      summary: "Verify Email"
      tags:
        - Auth
      responses:
        200:
          description: "Email verified successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                code:
                  type: "string"
  /auth/resend-verification:
    post:
      summary: "Resend Verification Email"
      tags:
        - Auth
      responses:
        200:
          description: "Verification email resent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
  /auth/change-password:
    post:
      summary: "Change Password"
      tags:
        - Auth
      responses:
        200:
          description: "Password changed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                oldPassword:
                  type: "string"
                newPassword:
                  type: "string"
  /auth/update-profile:
    patch:
      summary: "Update User Profile"
      tags:
        - Auth
      responses:
        200:
          description: "Profile updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseUser"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              properties:
                avatar:
                  type: "string"
                  format: "binary"
                name:
                  type: "string"
                bio:
                  type: "string"
  /auth/:
    delete:
      summary: "Delete Account"
      tags:
        - Auth
      responses:
        204:
          description: "Account deleted successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
  /auth/oauth/{provider}:
    get:
      summary: "OAuth Login"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "provider"
          in: "path"
          required: true
          schema:
            type: "string"
  /auth/oauth/{provider}/callback:
    get:
      summary: "OAuth Callback"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseAuthData"
      parameters:
        - name: "provider"
          in: "path"
          required: true
          schema:
            type: "string"
  /auth/2fa/setup:
    post:
      summary: "Setup 2FA"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  payload:
                    type: "object"
                    properties:
                      qrCode:
                        type: "string"
                      secret:
                        type: "string"
  /auth/2fa/verify:
    post:
      summary: "Verify 2FA"
      tags:
        - Auth
      responses:
        200:
          description: "Two-factor authentication verified"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                token:
                  type: "string"
                userId:
                  type: "string"
  /auth/2fa/disable:
    post:
      summary: "Disable 2FA"
      tags:
        - Auth
      responses:
        200:
          description: "Two-factor authentication disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                token:
                  type: "string"
                userId:
                  type: "string"
  /auth/2fa/backup-codes:
    post:
      summary: "Generate Backup Codes"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  payload:
                    type: "array"
                    items:
                      type: "string"
  /auth/2fa/backup-codes/verify:
    post:
      summary: "Verify Backup Code"
      tags:
        - Auth
      responses:
        200:
          description: "Backup code verified"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                code:
                  type: "string"
  /auth/2fa/backup-codes/regenerate:
    post:
      summary: "Regenerate Backup Codes"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                  payload:
                    type: "array"
                    items:
                      type: "string"
  /auth/2fa/backup-codes/disable:
    post:
      summary: "Disable Backup Codes"
      tags:
        - Auth
      responses:
        200:
          description: "Backup codes disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseNull"
  /auth/2fa/backup-codes/enable:
    post:
      summary: "Enable Backup Codes"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseBoolean"
  /auth/2fa/login:
    post:
      summary: "2FA Login"
      tags:
        - Auth
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseAuthData"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                userId:
                  type: "string"
                token:
                  type: "string"
                backupCode:
                  type: "string"
  /users/config:
    get:
      summary: "Get User Config"
      tags:
        - User
      responses:
        200:
          description: "Successful operation"
  /users/{id}:
    get:
      summary: "Get User By ID"
      tags:
        - User
      responses:
        200:
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponseUser"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
  /friends/followers/{id}:
    get:
      summary: "Get Followers"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "page"
          in: "query"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
        - name: "search"
          in: "query"
          schema:
            type: "string"
  /friends/followings/{id}:
    get:
      summary: "Get Followings"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "page"
          in: "query"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
        - name: "search"
          in: "query"
          schema:
            type: "string"
  /friends/suggestions:
    get:
      summary: "Get Suggestions"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
  /friends/search:
    get:
      summary: "Search Friends"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "search"
          in: "query"
          schema:
            type: "string"
  /friends/requests:
    get:
      summary: "Get Friend Requests"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "type"
          in: "query"
          schema:
            type: "string"
        - name: "page"
          in: "query"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
  /friends/blocks:
    get:
      summary: "Get Blocked Users"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "page"
          in: "query"
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
        - name: "text"
          in: "query"
          schema:
            type: "string"
  /friends/follow/{id}:
    post:
      summary: "Follow User"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
  /friends/unfollow/{id}:
    post:
      summary: "Unfollow User"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
  /friends/accept:
    patch:
      summary: "Accept Friend Request"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                requestId:
                  type: "string"
  /friends/cancel:
    patch:
      summary: "Cancel Friend Request"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                requestId:
                  type: "string"
  /friends/decline:
    patch:
      summary: "Decline Friend Request"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                requestId:
                  type: "string"
  /friends/block/{userId}:
    post:
      summary: "Block User"
      tags:
        - Friends
      responses:
        200:
          description: "Successful operation"
      parameters:
        - name: "userId"
          in: "path"
          required: true
          schema:
            type: "string"
  /settings/:
